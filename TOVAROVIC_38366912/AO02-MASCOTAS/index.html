<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap 4 -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />

    <title>Registro de Mascotas y Dueños</title>
  </head>
  <body>
    <div class="container mt-4">
      <h2 class="text-center mb-4">Registro de Mascotas y Dueños</h2>

      <div class="row">
        <!-- FORMULARIO -->
        <div class="col-md-4">
          <div class="card">
            <div class="card-header bg-primary text-white text-center">
              Registrar Nueva Mascota
            </div>

            <div class="card-body">
              <form id="formularioMascota">
                <div class="form-group">
                  <label>Nombre de la Mascota</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombreMascota"
                    required
                  />
                </div>

                <div class="form-group">
                  <label>Tipo de Mascota</label>
                  <select class="form-control" id="tipoMascota">
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                    <option value="ave">Ave</option>
                    <option value="roedor">Roedor</option>
                    <option value="otro">Otro</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Edad (en años)</label>
                  <input
                    type="number"
                    class="form-control"
                    id="edadMascota"
                    min="0"
                    required
                  />
                </div>

                <div class="form-group">
                  <label>Nombre del Dueño</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombreDuenho"
                    required
                  />
                </div>

                <div class="form-group">
                  <label>Teléfono del Dueño</label>
                  <input
                    type="text"
                    class="form-control"
                    id="telefonoDuenho"
                    required
                  />
                </div>

                <div class="form-group">
                  <label>¿Está vacunada?</label>
                  <select class="form-control" id="tieneVacunas">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-success btn-block">
                  Registrar Mascota
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- TABLA -->
        <div class="col-md-8">
          <div class="card">
            <div class="card-header text-center">
              <h4>Mascotas Registradas</h4>
            </div>

            <!-- FILTROS -->
            <div class="row p-3">
              <div class="col-md-6">
                <label>Filtrar por tipo</label>

                <select class="form-control" id="filtroTipo">
                  <option value="todos">Todos</option>
                  <option value="perro">Perro</option>
                  <option value="gato">Gato</option>
                  <option value="ave">Ave</option>
                  <option value="roedor">Roedor</option>
                  <option value="otro">Otro</option>
                </select>
              </div>

              <div class="col-md-6">
                <label>Filtrar por vacunación</label>

                <select class="form-control" id="filtroVacunas">
                  <option value="todos">Todos</option>
                  <option value="true">Vacunadas</option>
                  <option value="false">No vacunadas</option>
                </select>
              </div>
            </div>

            <!-- ESTADÍSTICAS -->
            <div class="card mx-3 mb-3">
              <div class="card-body bg-light">
                <h5>Estadísticas</h5>

                <div id="estadisticas"></div>
              </div>
            </div>

            <!-- TABLA -->
            <div class="table-responsive px-3">
              <table class="table">
                <thead class="thead-dark">
                  <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Edad</th>
                    <th>Dueño</th>
                    <th>Teléfono</th>
                    <th>Vacunada</th>
                    <th>Edad Humana</th>
                  </tr>
                </thead>

                <tbody id="tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
